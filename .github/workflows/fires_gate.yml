name: "fires gate: publish held, needs review"

# D-212's fires payload gate, checked as its OWN workflow rather than as a
# step inside fires.yml. Business's escalation, 2026-08-27: a HOLD and a
# CRASH were indistinguishable in CI, because refresh_gate.py ran as the
# last step of "Fires data pull and publish" and failing that step turned
# a correct, expected hold into the exact same red as a genuine
# ZeroDivisionError or network failure three days running. Kristjan
# cannot tell the two apart without opening a log, so he reported seven
# days of failure where the record held four, and the record was not
# wrong to read that way, because the signal did not distinguish.
#
# A hold means a human needs to look at real editorial changes and is
# not itself a defect. A crash means the pipeline broke. Those need
# different red lights. Splitting into a differently NAMED workflow is
# the cheapest thing that actually works: "Fires data pull and publish"
# can report success whenever the pull, build and commit succeeded,
# which is the pipeline's own health, and this workflow's name is what
# shows up in the run list and the failure email when a human is the
# thing that's needed rather than a fix.
#
# PATH-FILTERED PUSH was the original trigger and it never actually
# fired for fires.yml's own commits, discovered 2026-08-28: fires.yml
# pushes with the default GITHUB_TOKEN, and GitHub does not let a
# GITHUB_TOKEN-authored push trigger OTHER workflows, by design, to stop
# runaway trigger chains. Every real fires.yml run that ever moved the
# payload was invisible to this workflow's push trigger, silently, from
# the day this file was written. It looked correct in every test because
# every test was a manual workflow_dispatch or a human push, neither of
# which hits that restriction, and the one thing that could never be
# tested locally was the exact path this exists to cover.
#
# workflow_run fixes the TRIGGER: it fires on another workflow's
# COMPLETION, not on the push event that workflow made, so the
# GITHUB_TOKEN restriction does not apply. types: [completed] regardless
# of fires.yml's own conclusion, deliberately: the gate should be
# re-checked against whatever is currently committed whether fires.yml
# succeeded or not, and gating this on fires.yml's success would
# recreate exactly the hold-vs-crash conflation this workflow was split
# out to remove.
#
# WHAT IT DOES NOT FIX: github.event.workflow_run.head_sha is the commit
# fires.yml STARTED against, not the commit it ENDED at. fires.yml
# pushes up to three commits of its own during a single run (baseline,
# data pull, published pages), so by the time it completes, head_sha
# names a commit from before any of those landed. Checking that ref out
# here re-ran refresh_gate.py against pre-run state and reported
# PUBLISH while the real, post-run commit was genuinely HELD (D-212,
# 2026-08-29: Tunisia entering the qualifying set, five countries
# leaving it, Uganda and Ukraine flipping record qualification, four
# countries crossing the weekly #1 boundary). The gate looked correct
# in every earlier test because every earlier test was a manual
# workflow_dispatch against a quiet repo, where the pre-run and post-run
# commit happen to be the same thing. The one case that could never be
# tested that way is exactly the one this workflow exists for: checking
# state AFTER a real fires.yml run moved it.
#
# So: no ref override. actions/checkout@v4's default checks out
# whatever the branch is at NOW, at job-start time, which is what "is
# the currently committed payload held" actually has to mean. A commit
# landing in the few seconds between fires.yml's last push and this
# job's checkout is the one gap left, and it self-heals: the next
# workflow_run (or the next scheduled fires.yml run) re-checks current
# state again.
#
# push kept alongside it for a genuine human push to these paths (a
# hand-edit, a manual data fix) that workflow_run cannot see. Paths match
# fires/refresh_gate.py's own EVENTS_CUR/AREA_CUR/WEEK_CUR/EU_CUR/
# AREA_HIST_DIR exactly, so this list and that file cannot silently
# drift apart without both needing to change for the same reason.
on:
  workflow_run:
    workflows: ["Fires data pull and publish"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "data/events.json"
      - "fires/data/burnt_area.json"
      - "fires/data/current_week.json"
      - "fires/data/eu_area.json"
      - "fires/data/area_history/**"
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No ref: override, on purpose. See the comment block above this
      # job for why github.event.workflow_run.head_sha is the WRONG
      # commit here: it is fires.yml's start-of-run state, not its
      # end-of-run state, and this gate exists to check the latter.
      # Default checkout behaviour, the branch tip at job-start time, is
      # what "check current committed state" actually means.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Exit 0 (PUBLISH) is this job's success. Exit 1 (HOLD) fails it,
      # and that failure is now the ONLY thing this workflow's name can
      # mean, unlike the old shared step where it meant either "a human
      # is needed" or "something is broken" with no way to tell from the
      # run list alone.
      - name: Check the fires payload gate
        run: PYTHONPATH="$PWD" python fires/refresh_gate.py
