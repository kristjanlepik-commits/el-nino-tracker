name: heat-collect

# THE ONLY JOB HERE WHOSE MISSED RUNS CANNOT BE RECOVERED.
#
# Tallinn is build-forward. There is no archive to fall back on: the only
# long record reaching 2026 is ECA&D-sourced and non-commercial, the
# commercially clear GHCN station stopped feeding in August 2025, and
# Estonia publishes its history through a web interface rather than an
# API. So the archive can be obtained later at any time and the current
# days cannot. An hour not collected is an hour permanently absent from
# the series.
#
# That is why this is hourly rather than daily. A daily minimum built
# from one sample a day is a reading, not a minimum; the cadence IS the
# measurement rather than a tuning choice. (Heat chat's reasoning, and
# the reason this was merged at speed.)
#
# Cloud rather than the laptop, deliberately: the laptop sleeps, and this
# is precisely the job that must not depend on that. Proven twice this
# month, once when the machine slept through eighteen hours of a CDS pull.
#
# Proposed by the Heat chat at heat/proposals/heat_collect.yml (053e50c).
# Merged with three changes, noted at each site.

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

# Own group, NOT `publish`. This renders nothing and publishes nothing,
# so it has no reason to queue behind a channel build, and an hourly job
# inside the publish lock would contend with the daily fires run and the
# Monday brief for no benefit. cancel-in-progress stays false because the
# file is append-only and a cancelled write is worse than a late one.
concurrency:
  group: heat-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # CHANGE 1, and the important one. The proposal had no timeout.
    #
    # Combined with `cancel-in-progress: false`, a single hung run would
    # hold the concurrency group forever and every subsequent hour would
    # queue behind it. The collector would stop, silently, on the one
    # dataset that cannot be back-filled, and the symptom would be
    # "no new samples" rather than "a job failed".
    #
    # This is the HDF5 lesson from the floods capture in a worse place: a
    # hang is not a failure until something calls it one. Five minutes is
    # generous for one small unauthenticated fetch.
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sample
        run: python heat/collect_forward.py

      - name: Commit if changed
        run: |
          git config user.name  "tls-heat-collector"
          git config user.email "noreply@thelongswell.com"
          git add heat/data/collected/
          if git diff --cached --quiet; then
            echo "No new sample this hour; nothing to commit."
            exit 0
          fi
          git commit -m "heat: collected sample $(date -u +'%Y-%m-%dT%H:%MZ')"
          # CHANGE 2. The proposal did one `git pull --rebase --autostash`
          # then one `git push`. That is a single attempt, and Heat's own
          # note says a rejected push loses that hour with no way to
          # recover it. scripts/push_retry.sh rebases and retries up to
          # five times with backoff, and fails loudly on a genuine
          # conflict rather than force-pushing. An hourly job WILL race a
          # human push; this is the difference between usually fine and
          # reliably fine.
          bash scripts/push_retry.sh main
