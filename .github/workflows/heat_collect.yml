name: heat-collect

# THE ONLY JOB HERE WHOSE MISSED RUNS CANNOT BE RECOVERED.
#
# Tallinn is build-forward. There is no archive to fall back on: the only
# long record reaching 2026 is ECA&D-sourced and non-commercial, the
# commercially clear GHCN station stopped feeding in August 2025, and
# Estonia publishes its history through a web interface rather than an
# API. So the archive can be obtained later at any time and the current
# days cannot. An hour not collected is an hour permanently absent from
# the series.
#
# That is why this is hourly rather than daily. A daily minimum built
# from one sample a day is a reading, not a minimum; the cadence IS the
# measurement rather than a tuning choice. (Heat chat's reasoning, and
# the reason this was merged at speed.)
#
# Cloud rather than the laptop, deliberately: the laptop sleeps, and this
# is precisely the job that must not depend on that. Proven twice this
# month, once when the machine slept through eighteen hours of a CDS pull.
#
# Proposed by the Heat chat at heat/proposals/heat_collect.yml (053e50c).
# Merged with three changes, noted at each site.

# GITHUB ACTIONS CRON IS UTC. ALWAYS. There is no timezone field, and
# nothing in the file will tell you when you get it wrong; the job simply
# runs at the wrong time forever.
#
# Tallinn is UTC+3 (EEST) for the whole of May-September, so local night
# 00:00-07:59 is UTC 21:00-04:59, which WRAPS MIDNIGHT UTC. Heat's
# proposal asked for UTC hours 0-7. That is local 03:00-10:00: it misses
# the first three hours of the night entirely and spends three of its
# eight hours on full morning. The sample that lost the minimum on
# 2026-08-09 was 12.9 C at local 02:38, which is 23:38 UTC, one hour
# BEFORE the proposed window would have started.
#
# The season bound makes the +3 offset safe rather than lucky: Estonia is
# on EEST from late March to late October, so no part of May-September
# ever falls in EET. Widening the months past April or October
# reintroduces a DST seam and these hour numbers stop being correct.
#
# Edge effect, small and stated rather than hidden: the month field is
# also evaluated in UTC, so collection starts at local 03:00 on 1 May and
# runs to local 02:59 on 1 October.
on:
  schedule:
    # Daytime: hourly, local 08:00-23:59. A daily minimum never occurs
    # here, so resolution buys nothing and the hourly cadence is only
    # keeping the series continuous.
    - cron: "7 5-20 * 5-9 *"
    # Night: every 20 minutes, local 00:00-07:59. This is where the daily
    # minimum lives and where the whole point of the collector sits.
    #
    # Minutes 9/29/49 rather than 0/20/40 on purpose. GitHub deprioritises
    # scheduled runs under load and :00 is the most contended minute on
    # the platform; the two runs actually dropped on 2026-08-09 were the
    # 00:07 and 01:07 firings, inside the busiest UTC window there is.
    - cron: "9,29,49 21-23,0-4 * 5-9 *"
  workflow_dispatch:

# WHAT THIS BUYS, STATED HONESTLY: a smaller expected blind spot, NOT a
# bounded one. GitHub does not guarantee scheduled execution and drops
# firings silently. Three chances an hour instead of one is redundancy
# against dropped runs as much as it is resolution, and neither cron nor
# any change to it can promise a 20-minute interval. If the minimum ever
# has to be defensible rather than indicative, that needs a source that
# reports a true minimum, not a faster poll of an instantaneous one.
#
# Cost, also stated: ~40 commits a day in season, ~6,100 a year, all
# mechanical. Heat's estimate of ~3,600 was the hourly-only figure; the
# night change roughly doubles it back. For a readable human log:
#   git log --invert-grep --grep='^heat: collected'

# Own group, NOT `publish`. This renders nothing and publishes nothing,
# so it has no reason to queue behind a channel build, and an hourly job
# inside the publish lock would contend with the daily fires run and the
# Monday brief for no benefit. cancel-in-progress stays false because the
# file is append-only and a cancelled write is worse than a late one.
concurrency:
  group: heat-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # CHANGE 1, and the important one. The proposal had no timeout.
    #
    # Combined with `cancel-in-progress: false`, a single hung run would
    # hold the concurrency group forever and every subsequent hour would
    # queue behind it. The collector would stop, silently, on the one
    # dataset that cannot be back-filled, and the symptom would be
    # "no new samples" rather than "a job failed".
    #
    # This is the HDF5 lesson from the floods capture in a worse place: a
    # hang is not a failure until something calls it one. Five minutes is
    # generous for one small unauthenticated fetch.
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # NAMED EXPLICITLY. With no argument this iterates every city in
      # SOURCES, and London arrived in that dict on 2026-08-10 with a key
      # this workflow does not hold. Combined with collect_forward now
      # RAISING on a missing key rather than returning empty, one city's
      # absent credential killed the whole run: Tallinn stopped collecting
      # for 51 hours, on the one dataset where a missed hour is permanent.
      #
      # I made it raise so a missing key could not silently lose data. It
      # loudly lost data on a different city instead. London has its own
      # workflow and its own secret; this one is Tallinn's.
      - name: Sample
        run: python heat/collect_forward.py Tallinn

      - name: Commit if changed
        run: |
          git config user.name  "tls-heat-collector"
          git config user.email "noreply@thelongswell.com"
          git add heat/data/collected/
          if git diff --cached --quiet; then
            echo "No new sample this hour; nothing to commit."
            exit 0
          fi
          git commit -m "heat: collected sample $(date -u +'%Y-%m-%dT%H:%MZ')"
          # CHANGE 2. The proposal did one `git pull --rebase --autostash`
          # then one `git push`. That is a single attempt, and Heat's own
          # note says a rejected push loses that hour with no way to
          # recover it. scripts/push_retry.sh rebases and retries up to
          # five times with backoff, and fails loudly on a genuine
          # conflict rather than force-pushing. An hourly job WILL race a
          # human push; this is the difference between usually fine and
          # reliably fine.
          bash scripts/push_retry.sh main
