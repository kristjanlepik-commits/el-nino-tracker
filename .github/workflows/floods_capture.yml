name: Floods VIIRS daily capture

# Implements D-038: capture the global VIIRS flood product daily, keep
# 0.1 degree aggregates, discard the raw tiles, before MODIS shuts down.
#
# THIS JOB IS NOT LIKE THE OTHERS. Every other fetch here can be retried
# tomorrow. This one cannot: LANCE keeps about seven days and deletes,
# so a missed run is a permanent hole in every future VIIRS baseline and
# the window closes when Terra goes off around January 2027. The weekly
# brief's rule is never crash on a Monday, carry forward quietly. This
# job's rule is the opposite: fail loudly, because a quiet failure is
# indistinguishable from success and costs data nobody can buy back.
#
# PLATFORM DECISION 1, why CI rather than the laptop. The Floods chat
# installed a launchd plist as a stopgap and asked whether this belongs
# in CI at all. It does, and perishability is the whole argument: a
# laptop that is asleep, travelling or shut produces a permanent gap,
# and "the record has holes whenever the machine was off" is not a
# property worth accepting for the one dataset that cannot be refetched.
# 90 minutes fits inside the 6 hour job cap, 3.5 GB fits the ~14 GB
# runner disk since tiles are reduced and discarded, and Actions minutes
# are free on a public repo. Retire the launchd plist once this has run
# clean for a few days; running both meanwhile is harmless, because the
# capture skips any date already written.
#
# PLATFORM DECISION 2, where the output lives. Roughly 7 MB a day, about
# 1 GB by January. Not git: that is a permanent binary in the history of
# a public repo, paid by every clone forever. Not Actions artifacts:
# they expire at 90 days and this record has to outlive that. So a
# GitHub Release used as an object store, one asset per day under a
# single tag. Free, outside git history, durable, and fetchable with
# `gh release download`. The manifest JSONL stays in the repo, because
# it is small and it is the index to the assets.
#
# Consequence accepted: the assets are public. It is reduced NASA public
# data, so that is fine, and arguably better than fine given the site
# argues for showing its working.

on:
  schedule:
    # 02:00 UTC, first in the slot map because it is the most perishable
    # thing we fetch. See research/handover_platform_contract.md.
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write          # commit the manifest, and upload release assets
  issues: write            # open_alert_issue.sh when the capture fails

# No concurrency group on purpose. This job renders nothing and
# publishes nothing, and the quota pools are independent, so it has no
# reason to queue behind another channel's publish.

jobs:
  capture:
    runs-on: ubuntu-latest
    # 90 minutes observed, plus margin. A timeout is mandatory here: the
    # HDF/netCDF failure mode is a hang, not a crash, and an untimed job
    # would sit until the runner limit while the day it was capturing
    # ages out of LANCE.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Earthdata token
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: |
          # Fail loudly and immediately. A missing token here is not a
          # degraded run, it is a lost day.
          if [ -z "$EARTHDATA_TOKEN" ]; then
            echo "::error::EARTHDATA_TOKEN is not set. Today's VIIRS day \
          will be lost permanently: LANCE deletes after about seven days. \
          Add the secret in Settings, Secrets and variables, Actions."
            exit 1
          fi
          printf '%s' "$EARTHDATA_TOKEN" > ~/.earthdata_token
          chmod 600 ~/.earthdata_token

      - name: Verify the token actually authenticates
        # Fetches ONE real tile and checks the HDF5 signature, the same
        # URL and header the capture uses. The previous probe read a
        # directory listing, which answers WITHOUT auth, so it printed
        # "authenticated" on 2026-09-28 with a token two days expired
        # (FLO's finding). A file is what discriminates: HDF5 with a
        # valid token, a login page with an invalid one, proven both ways
        # on this path. Non-fatal by design: Capture is the step that
        # fails (--fail-on-loss), and this only names the likely cause.
        run: |
          NRT="https://nrt3.modaps.eosdis.nasa.gov/archive/allData/5200/VCDWD_L3_NRT"
          AUTH="Authorization: Bearer $(cat ~/.earthdata_token)"
          y=$(date -u +%Y)
          for i in 1 2 3; do
            doy=$(curl -sS -m 60 "$NRT/$y.json" 2>/dev/null | python3 -c 'import sys,json; d=sorted(c["name"] for c in json.load(sys.stdin)["content"] if c["name"].isdigit()); print(d[-3] if len(d)>=3 else "")' 2>/dev/null)
            f=$([ -n "$doy" ] && curl -sS -m 60 "$NRT/$y/$doy.json" 2>/dev/null | python3 -c 'import sys,json; d=[c["name"] for c in json.load(sys.stdin)["content"] if c["name"].endswith(".h5")]; print(d[0] if d else "")' 2>/dev/null)
            if [ -z "$f" ]; then
              echo "attempt $i: could not list a file to probe (network?)"
              sleep $((i * 10)); continue
            fi
            magic=$(curl -sS -L -m 120 -H "$AUTH" "$NRT/$y/$doy/$f" 2>/dev/null | head -c 8 | od -An -tx1 | tr -d ' \n')
            if [ "$magic" = "894844460d0a1a0a" ]; then
              echo "token OK: downloaded $y/$doy/$f and it is HDF5"
              exit 0
            fi
            echo "attempt $i: $y/$doy/$f did not come back as HDF5 (first bytes: ${magic:-none})"
            sleep $((i * 10))
          done
          echo "::warning::The token could not fetch a real HDF5 tile in 3 attempts. With the listing reachable, that is the expired- or invalid-token signature (it is exactly what 2026-09-28 looked like). Capture will fail with --fail-on-loss if so."

      - name: Capture
        run: |
          mkdir -p "${RUNNER_TEMP}/vcdwd"
          python floods/capture_viirs_global.py \
            --out-dir "${RUNNER_TEMP}/vcdwd" \
            --workers 6 \
            --min-age-days 2 \
            --fail-on-loss
          ls -la "${RUNNER_TEMP}/vcdwd" || true

      - name: Store the aggregates as release assets
        # !cancelled(), not success(): Capture now exits non-zero when any
        # day is lost (--fail-on-loss, FLO's 090b73f0), and without this
        # every day it DID capture would be skipped here and die with the
        # runner, turning one lost day into all of them. Same reason the
        # manifest has been uncommitted since 2026-09-02: the expiry
        # warning failed and this step was skipped behind it.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="vcdwd-capture"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --title "VIIRS VCDWD 0.1 degree daily aggregates" \
              --notes "Daily global aggregates captured under D-038. One asset per day. Raw tiles are discarded; these are the retained record." \
              --latest=false
          shopt -s nullglob
          FILES=("${RUNNER_TEMP}"/vcdwd/*.npz)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::warning::No new aggregate produced this run. With \
          --min-age-days 2 there are days when nothing has aged in yet. \
          This is only wrong if it repeats."
          else
            gh release upload "$TAG" "${FILES[@]}" --clobber
            echo "uploaded ${#FILES[@]} file(s)"
          fi

      # AFTER the capture, deliberately. Failing before it would stop the
      # very run whose data cannot be recovered, which would make the
      # guard cause the harm it exists to prevent. Capture first, then go
      # red so the expiry is visible while there is still time to renew.
      - name: Warn if the Earthdata token is near expiry
        run: python3 scripts/check_token_expiry.py

      - name: Commit the manifest
        # !cancelled(), not success(): Capture now exits non-zero when any
        # day is lost (--fail-on-loss, FLO's 090b73f0), and without this
        # every day it DID capture would be skipped here and die with the
        # runner, turning one lost day into all of them. Same reason the
        # manifest has been uncommitted since 2026-09-02: the expiry
        # warning failed and this step was skipped behind it.
        if: ${{ !cancelled() }}
        run: |
          git config user.name "el-nino-tracker-bot"
          git config user.email "actions@github.com"
          git add floods/data/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "floods: VIIRS capture manifest $(date -u +'%Y-%m-%d')"
            bash scripts/push_retry.sh main
          else
            echo "No manifest change."
          fi

      # FLO's guard, wired here rather than earlier for the reason already
      # stated above the token check: a guard that runs BEFORE the capture
      # can stop the one run whose data cannot be recovered, which makes
      # the guard cause the harm it exists to prevent. It also has to run
      # after the manifest commit, because it reconciles the manifest
      # AGAINST the release store and both must be current for the
      # comparison to mean anything.
      #
      # It treats the release store as authoritative and reports the two
      # directions separately, which is the part worth keeping: "index
      # wrong, data safe" and "data missing" have opposite severities and
      # a single "mismatch" would flatten them.
      #
      # Exit 2 is unreadable, 1 is divergence, 0 is clean. Both non-zero
      # cases fail the step: an unreadable store is not evidence of
      # health, and this repo has already shipped one guard that treated
      # an unreadable endpoint as permission to proceed.
      - name: Reconcile the capture manifest against the release store
        # !cancelled(), not success(): Capture now exits non-zero when any
        # day is lost (--fail-on-loss, FLO's 090b73f0), and without this
        # every day it DID capture would be skipped here and die with the
        # runner, turning one lost day into all of them. Same reason the
        # manifest has been uncommitted since 2026-09-02: the expiry
        # warning failed and this step was skipped behind it.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 floods/check_capture_gaps.py

      # A failure here is PERMANENT data loss, not a delay: LANCE keeps
      # about seven days. Its token expired on 2026-09-26 and this job was
      # red for eight consecutive days before anyone looked, the expiry
      # step being the only honest one (Capture exited green having
      # discarded every tile). So a failure goes to Kristjan's inbox.
      - name: Tell Kristjan the VIIRS capture failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/open_alert_issue.sh \
            "VIIRS flood capture failing" \
            "floods_capture.yml failed. Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Check which step: if it was the capture itself, LANCE deletes after about 7 days and days are being lost; a later step (manifest, token warning) can fail with the data safe, as from 2026-09-21 to 09-25."

