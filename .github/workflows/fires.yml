name: Fires data pull and publish

# DAILY, per Kristjan 2026-07-27: "fire update needs to be daily, it is
# changing fast." El Nino stays Monday (weekly_brief.yml).
#
# 06:00 UTC because FIRMS near-real-time processing only guarantees
# yesterday is closed at about 03:00 UTC, and build_events.py refuses to
# run before then on purpose.
#
# ONE BLOCKING DEPENDENCY, owned by the Fire chat. build_events.py
# compares the trailing complete 7-day window against a frozen same-week
# baseline in fires/data/country_history.json, and that baseline holds
# ONE calendar week. The trailing window moves every day, so the two
# agree on roughly one day per refresh and the script refuses on the
# rest rather than compare against a stale baseline, which is correct
# behaviour on its part.
#
# So until full-year per-country baselines exist (about 1,095 archive
# requests, paid once, since the archive is static), this job can only
# actually update the page on the day the windows line up. That is a
# baseline problem, not a scheduling one, and no cron can work around
# it. Daily runs are scheduled now so the cadence is right the moment
# the baselines land.
#
# Until then the stale-baseline case is a WARNING, not a failure: a job
# that is red six days in seven trains everyone to ignore CI, and the
# distinction that matters is "could not compare" versus "something
# broke". Real errors still fail loudly.

# TIMING, and the floor is a data-quality constraint rather than a
# preference. Kristjan asked for the pages to be fresh early in the
# morning (2026-07-28). 04:00 UTC is 07:00 in Tallinn and 06:00 in
# central Europe, so the site is current before an EU reader opens it.
#
# It cannot go earlier than 03:00 UTC: FIRMS near-real-time processing
# only guarantees yesterday is closed by about then, and build_events.py
# refuses to run before 03:00 on purpose, so that a retry cannot quietly
# publish an unfinished day. 04:00 leaves an hour of margin against that
# boundary, down from three at the old 06:00 slot. If undercounts ever
# appear on early runs, that margin is the first thing to suspect and
# 05:00 UTC is the fallback.
#
# GitHub's scheduled runs are also routinely 5 to 20 minutes late, which
# eats into the margin rather than the reader's morning.
on:
  schedule:
    # TWO SLOTS, and the second is nearly free.
    #
    # The binding constraint is not our runtime, it is GitHub's scheduling
    # delay. On 2026-07-30 the 04:00 slot actually fired at 06:25, 2h25m
    # late, and with a ~35 minute run that lands at 07:00 UTC, which is
    # 10:00 in Tallinn and past the 09:00 target. No amount of tuning our
    # own steps fixes a queue we do not control; more slots does.
    #
    # 03:10 is as early as this can go. build_events.py refuses before
    # 03:00 UTC because FIRMS only guarantees the previous day is closed
    # by then, and that refusal is correct: publishing an unfinished day
    # reads as a die-down. 10 minutes of margin past the floor, and now
    # nearly three hours of delay absorption before 06:00 UTC.
    #
    # The 05:30 slot is a backstop for a FAILED or very late first run,
    # not a second full pull. fetch_window_baseline.py returns
    # immediately when the baseline already covers the window, and
    # build_events and publish are both no-ops when nothing changed, so a
    # redundant run costs a couple of minutes rather than seventeen. The
    # shared `publish` concurrency group queues it if the first is still
    # going, so the two cannot race.
    - cron: "10 3 * * *"
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Serialise every workflow that publishes. With per-channel schedules
# two of these will eventually run at once, and a race between two
# publishes is a corrupted commit rather than a slow build. One shared
# group name across all publishing workflows is the point. D-027.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  fires:
    runs-on: ubuntu-latest
    # 90, not 60. Adding up the step budgets: setup 2, baseline 30,
    # commit 1, quota wait 20, detections 2, burnt area 3, publish 3, plus
    # commits, gives a worst case of about 63 minutes. A 60 minute job
    # timeout therefore killed the run on a bad day, and did so at the
    # END, discarding the publish after paying for every fetch.
    #
    # A job timeout is a backstop against a runaway, not a scheduling
    # tool. The real bounds are the per-step timeouts above, which is
    # where a hang now gets caught. This only needs to sit above the sum
    # of them with room to spare.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # qa_check compares frozen surfaces against origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure FIRMS key
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          # build_events.py reads the key from ~/.firms_map_key, not the
          # environment. Fail loudly rather than proceed: without the key
          # the pull cannot work, and a silent skip would leave a stale
          # page looking freshly published.
          if [ -z "$FIRMS_MAP_KEY" ]; then
            echo "FIRMS_MAP_KEY secret is not set. Add it in Settings," \
                 "Secrets and variables, Actions." >&2
            exit 1
          fi
          printf '%s' "$FIRMS_MAP_KEY" > ~/.firms_map_key
          chmod 600 ~/.firms_map_key

      # Refresh the same-week baseline FIRST. Without this the baseline
      # is whatever one-off job built it, the trailing window advances
      # past it the next day, and build_events.py then refuses every run
      # for the rest of time. That is exactly what happened: the
      # detections layer sat frozen from 27 to 29 July while hectares
      # updated around it, so the page stayed plausible and nobody
      # noticed. The refusal was correct; there was simply no way to
      # give it a current baseline. There is now.
      #
      # BOUNDED AND NON-FATAL, after this step took the whole job down on
      # 2026-07-30. It hung with no output, ran 58 minutes, and the
      # job-level timeout-minutes: 60 then cancelled everything after it:
      # detections, burnt area and the publish were all skipped, so the
      # public fire page did not refresh that day. The step had completed
      # in about 5 minutes the day before, so this is an intermittent hang
      # rather than a slow step.
      #
      # Cause: fires/fetch_window_baseline.py:140 calls pd.read_csv(url)
      # against the FIRMS area API. Pandas reads URLs through urllib with
      # NO default timeout, so an unanswered request blocks forever. That
      # is the Fire chat's file to fix; reported separately. What belongs
      # here is making sure one hung fetch cannot cost the whole job.
      #
      # A job-level timeout alone is the wrong instrument: it fires late
      # and kills every step that had not yet run. A step-level timeout
      # costs 10 minutes and lets the rest of the job proceed. Failure is
      # tolerated on purpose: without a fresh baseline, build_events.py
      # refuses and the workflow already treats that as a warning, while
      # burnt area can still refresh and the publish can still run.
      # 30 minutes, not 10. The first attempt at this used 10 and traded a
      # hang for a truncation: the step reached country 22 of 45 and was
      # cut, and because fetch_window_baseline.py writes
      # country_history.json only after ALL 45 countries complete, a
      # truncated run writes NOTHING. Detections then stayed frozen for a
      # third day while the step looked bounded and well behaved.
      #
      # A generous budget is safe here in a way it was not before, and the
      # reason matters: individual requests are now bounded by
      # fires/_http.py, so this timeout is no longer the only thing
      # standing between a stalled socket and an infinite job. It only has
      # to exceed legitimate worst-case work, which is 45 countries plus
      # whatever a few exhausted retries add. Observed range is 5 to 10
      # minutes. The job timeout stays at 60, and burnt area plus publish
      # need about 5, so 30 leaves real headroom on both sides.
      - name: Refresh the same-week baseline
        id: baseline
        timeout-minutes: 30
        continue-on-error: true
        run: PYTHONPATH="$PWD" python fires/fetch_window_baseline.py

      - name: Note a failed baseline refresh
        if: steps.baseline.outcome != 'success'
        run: |
          echo "::warning::The same-week baseline refresh did not complete \
          (outcome: ${{ steps.baseline.outcome }}). build_events.py will \
          refuse to compare against a stale baseline, so detections will \
          not advance today. Burnt area and the publish still run. If this \
          repeats, suspect the unbounded pd.read_csv in \
          fires/fetch_window_baseline.py:140."

      # COMMIT THE BASELINE THE MOMENT IT EXISTS, before anything that can
      # fail. On 2026-07-30 the refresh finally completed after 17 minutes
      # of FIRMS pulls, then build_events.py failed, the commit step was
      # skipped because the job had failed, and all 17 minutes of work was
      # discarded with the runner. The next run began from scratch.
      #
      # A step that expensive must be durable independently of what comes
      # after it. This is the renderers-never-fetchers rule applied one
      # level down: a fetch that succeeded is a fact worth keeping even
      # when the thing consuming it breaks.
      # WIDENED to fires/data/full_history/ for the Fire chat's
      # incremental day cache (2026-08-03). Without this the new
      # day-records die with the runner every morning, the cache never
      # accumulates, and the 26-minute-to-4-minute saving never arrives:
      # the job would pay full price forever while looking like it had
      # been optimised.
      #
      # It also makes a TRUNCATED run useful rather than wasted. The
      # cache is resumable by construction (a year is refetched unless
      # marked complete), so a step cut at its budget still leaves real
      # progress, and committing it is what turns "cut short" into
      # "converging". With two cron slots that is two increments a day.
      - name: Commit the refreshed baseline and day cache
        if: always()
        run: |
          git config user.name "el-nino-tracker-bot"
          git config user.email "actions@github.com"

          # Validate before committing. This step runs under if: always(),
          # so it fires precisely when the previous step was killed
          # mid-write, and a JSON file truncated by a timeout would
          # otherwise be committed as fact. A corrupt baseline does not
          # look corrupt on a page, it looks like a bigger number.
          #
          # In a script, not inline: an embedded heredoc broke this YAML
          # twice, because a block scalar ends at the first line indented
          # less than the block.
          python3 scripts/validate_baselines.py

          git add fires/data/country_history.json fires/data/full_history/
          if ! git diff --cached --quiet; then
            git commit -m "fires: baseline refresh and day cache $(date -u +'%Y-%m-%d')"
            bash scripts/push_retry.sh main
          else
            echo "Baseline and cache unchanged."
          fi

      # WAIT FOR QUOTA before spending it again. The refresh above walks 45
      # countries and leaves the key close to its ceiling; build_events.py
      # then ran immediately and got HTTP 400 from FIRMS, which is what
      # over-limit looks like. Two steps in one job competing for one
      # account-wide budget is not a race we can win by retrying, only by
      # waiting: the limit is 5,000 transactions per rolling 10 minutes, so
      # the budget refills on its own within one window.
      - name: Wait for FIRMS quota to refill
        timeout-minutes: 20
        run: |
          for i in $(seq 1 20); do
            # sed rather than embedded python: a multi-line python -c
            # inside a YAML block scalar has to stay indented past the
            # block, and getting that wrong silently truncates the whole
            # file. It did, on the first attempt at this step.
            q=$(curl -s --max-time 20 \
              "https://firms.modaps.eosdis.nasa.gov/mapserver/mapkey_status/?MAP_KEY=$(cat ~/.firms_map_key)" \
              | sed -n 's/.*"current_transactions" *: *\([0-9]\{1,\}\).*/\1/p')
            [ -z "$q" ] && q=-1
            if [ "$q" = "-1" ]; then
              echo "Quota endpoint unreadable; waiting rather than guessing."
            elif [ "$q" -lt 1500 ]; then
              echo "Quota at $q/5000, enough headroom. Proceeding."
              exit 0
            else
              echo "Quota at $q/5000, waiting 60s (attempt $i/20)."
            fi
            sleep 60
          done
          echo "::warning::Quota did not fall below 1500 in 20 minutes. \
          Proceeding anyway; build_events may hit HTTP 400."

      # continue-on-error, so a detections failure cannot take down the
      # burnt-area pull or the publish. Those refresh on a different clock
      # and holding them hostage to detections is what left the page
      # untouched for a whole morning. A real failure is still surfaced by
      # the step below rather than swallowed.
      - name: Pull fire data
        id: pull
        continue-on-error: true
        run: |
          set +e
          out=$(PYTHONPATH="$PWD" python fires/build_events.py 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ]; then
            # House convention for data jobs, from the CRO chat 2026-07-28:
            #   0  did work
            #   3  nothing to do, expected, warn and skip
            #   *  broken, fail loudly
            #
            # The string match below is the OLD way and is fragile: it
            # couples this workflow to a message owned by another chat,
            # so a reword would silently turn an expected refusal into a
            # daily red build. Kept only until build_events.py adopts
            # exit 3, then delete it.
            if [ $code -eq 3 ] || echo "$out" | grep -q "refresh the history first"; then
              echo "::warning::Fires page NOT updated: the baseline window \
          does not cover the trailing week, so build_events.py refused. This \
          resolves when full-year per-country baselines land (Fire chat)."
              echo "skipped=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            exit $code
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      # Burnt area runs even when detections could not, and that is the
      # point. The two halves of a country page refresh on different
      # clocks: hectares can move daily, detections only on the one day
      # in seven the trailing window lines up with the frozen baseline.
      # Gating this on the step above would hold the half that CAN
      # refresh hostage to the half that cannot.
      #
      # It is a FETCHER, so it runs here and never from inside a publish.
      # It exits 1 on failure by design rather than raising: a failed
      # pull leaves the previous data intact and merely older, so a warn
      # and carry on is more honest than failing the build.
      # ONE RETRY, after letting the quota refill. The only failure this
      # step has actually shown is HTTP 400 from FIRMS, which is what
      # over-limit looks like, and the cause is structural: the baseline
      # refresh immediately before it walks 45 countries and leaves the
      # key near its ceiling. The wait before the first attempt handles
      # the common case; this handles the day the refill is slower than
      # the wait allowed.
      #
      # Retrying is only worth it because the budget refills on a clock
      # rather than on our behaviour. A retry against a genuinely broken
      # endpoint would just cost three more minutes, which is acceptable
      # against a full day of stale detections.
      - name: Retry detections once after a longer quota wait
        if: steps.pull.outcome == 'failure'
        id: pull_retry
        continue-on-error: true
        timeout-minutes: 25
        run: |
          for i in $(seq 1 15); do
            q=$(curl -s --max-time 20 \
              "https://firms.modaps.eosdis.nasa.gov/mapserver/mapkey_status/?MAP_KEY=$(cat ~/.firms_map_key)" \
              | sed -n 's/.*"current_transactions" *: *\([0-9]\{1,\}\).*/\1/p')
            [ -z "$q" ] && q=99999
            if [ "$q" -lt 500 ]; then
              echo "Quota at $q/5000. Retrying detections."
              break
            fi
            echo "Quota at $q/5000, waiting 60s before retry (attempt $i/15)."
            sleep 60
          done
          PYTHONPATH="$PWD" python fires/build_events.py

      # The signal that continue-on-error above would otherwise destroy.
      # Without this a detections crash produces a GREEN run carrying
      # silently stale data, which is the exact failure this repo keeps
      # relearning: the page stays well-formed, every check passes, and
      # nobody finds out until a human asks. The earlier version of this
      # workflow claimed in a comment that a failure was "surfaced by the
      # step below" while no such step existed.
      #
      # An expected refusal (exit 3, or the legacy message) is already
      # handled inside the pull step and is not a failure. This fires only
      # when the step genuinely broke.
      - name: Note a failed fire-data pull
        if: steps.pull.outcome == 'failure' && steps.pull_retry.outcome != 'success'
        run: |
          echo "::error::Detections did NOT update: build_events.py failed \
          (not an expected refusal). The page will publish with the \
          previous detections, so it stays well-formed while being stale. \
          scripts/check_freshness.py will fail once data/events.json \
          passes 2 days. Check the FIRMS quota first: HTTP 400 from that \
          API is what over-limit looks like."

      - name: Pull burnt area
        run: |
          set +e
          PYTHONPATH="$PWD" python fires/fetch_area_daily.py
          if [ $? -ne 0 ]; then
            echo "::warning::Burnt-area pull failed. The previous data is \
          still on disk and still valid, only older. Not failing the build."
          fi

      # Commit the data BEFORE publishing, deliberately. publish_all.py
      # rejects a publish if a data file changed during the run, because
      # that is what a fetcher wired into a publish path looks like. The
      # rule is renderers-only, so fetches land as their own commit and
      # the publish then runs against committed state.
      - name: Commit the data pulls
        run: |
          git config user.name "el-nino-tracker-bot"
          git config user.email "actions@github.com"
          git add data/ fires/data/
          if ! git diff --cached --quiet; then
            git commit -m "fires: data pull $(date -u +'%Y-%m-%d')"
          else
            echo "No data changes."
          fi

      # Unconditional now. Publishing is deterministic and a no-op when
      # nothing changed, and gating it on the detections pull meant a
      # template or design change never reached the fire pages on the six
      # days in seven that pull skips.
      - name: Publish
        run: python scripts/publish_all.py

      # LAST, deliberately, and it must be able to fail the run.
      #
      # The Fire chat's ask, after a publish reported complete success on
      # 2026-08-05 while the window did not move: the site served
      # 07-29..08-04 for a second day with 08-05 available. Same shape
      # froze detections 27-29 July and again on 08-06. Every existing
      # check asked a different question (did the step exit zero, did the
      # page render, does docs match its generator, is the data inside
      # budget) and all of those are satisfied by a run that achieved
      # nothing.
      #
      # It lives here rather than in fires/ at their request: a check a
      # channel writes about its own output inherits that channel's blind
      # spots, which floods and fire have both now demonstrated twice.
      #
      # After the publish, not before. A stale window is no reason to
      # withhold burnt area, which moves on its own clock. Publish, then
      # go red.
      - name: Assert the baseline window advanced
        run: python3 scripts/check_window_advanced.py

      - name: Commit the published pages
        run: |
          git add docs/
          if ! git diff --cached --quiet; then
            git commit -m "fires: publish $(date -u +'%Y-%m-%d')"
          else
            echo "No page changes."
          fi
          # Unconditional: the data commit from the earlier step still
          # needs pushing even when the pages did not move.
          bash scripts/push_retry.sh main
