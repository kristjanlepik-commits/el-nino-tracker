name: heat-refresh

# The weekly heat refresh. Kristjan set the cadence 2026-08-08: Mondays,
# May to September, frozen October to April.
#
# WHAT THIS JOB DOES NOT DO: publish. It fetches, rebuilds the payload,
# commits it, and reports the refresh gate's verdict. Rendering stays with
# scripts/publish_all.py, which is the one publish path and which now
# consults heat/refresh_gate.py itself.
#
# That split is deliberate. Two paths that can both put heat pages live is
# how a gate gets bypassed, and this repo has already had exactly that:
# publish_all rebuilt heat pages from whatever was committed, so the
# Monday brief would have rendered a HELD payload without asking the gate.
# Adding a second publisher here would reopen it from the other side.
#
# So the contract is: this job decides what the DATA says. publish_all
# decides whether pages move. The gate is consulted in one place.
#
# ORDER MATTERS. emit_city_nights.py reads ONLY heat/data/city_series.json
# (the D-030 seam), and build_city_series.py writes it from the raw
# dailies the fetchers pull. Running emit before build republishes last
# week's payload while reporting success.

on:
  schedule:
    # 06:23 UTC Monday, May to September. After the fires run at 03:10 and
    # 05:30 so they are not competing for a runner, and well before the
    # 13:00 brief, which is the thing that will render whatever this
    # leaves behind. Offset off the hour: :00 is the most contended minute
    # on GitHub's scheduler and two collector runs were already dropped
    # inside the 00-02 UTC window on 2026-08-09.
    - cron: "23 6 * 5-9 1"
  workflow_dispatch:

concurrency:
  group: heat-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Ten fetchers against ten national services, several of them slow,
    # plus the four assembled-city builders added 2026-09-07. Generous,
    # but bounded: with cancel-in-progress false a hung run would hold
    # the group and silently skip the following weeks.
    #
    # 90, RAISED FROM 45 ON MEASUREMENT RATHER THAN ON A FAILURE. Run
    # 34106553569, on the cheap path, spent about 7 minutes in Fetch and
    # was still in the builder step at 21 minutes, 28 into a 45 minute
    # job. And that run UNDERSTATES the weekly cost: heat's 592b246c
    # landed after it was dispatched and makes build_bridge refetch the
    # current year rather than serve it from disk, which is correct (five
    # cities had frozen at their August fetch dates and reported success
    # every rebuild) and is one live pull per city per run that this
    # measurement got for free. Heat measured the six bridge cities at
    # roughly 20 minutes locally on that expensive path, with Algiers
    # walking from 1999 at a 3 second sleep per year.
    #
    # So the realistic weekly total is 35 to 45 minutes today and grows
    # by one year of Algiers every January. A JOB timeout kills mid-step
    # and commits nothing, so hitting it discards the fetch work too,
    # which makes thin headroom expensive rather than merely annoying.
    # 90 leaves room for a slow national service on a bad day without
    # being unbounded. Heat has two cost reductions in mind
    # (skip the sleep for cache-served years; start the range at the
    # first year the bridge contributes); if those land this can come
    # back down, and the number should follow a measurement then too.
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -q -r requirements.txt || pip install -q requests

      # TWO credentials, not one. I claimed AEMET was the only fetcher
      # needing a key, and the first live run proved otherwise at
      # fetch_lsm.py: it uses cdsapi, which reads ~/.cdsapirc from inside
      # the library rather than through any path this repo names, so a
      # grep for credential handling in heat/ never touched it.
      #
      # That is the seventh probe in a day that returned an answer about
      # something it had not looked at. Worth the line, because the fix
      # for the class is the same every time: make the probe prove it
      # found the thing before believing what it says about absence.
      #
      # Same format as weekly_brief.yml, which is the version already
      # known to work against CDS.
      - name: Configure CDS
        env:
          CDS_API_KEY: ${{ secrets.CDS_API_KEY }}
        run: |
          if [ -z "$CDS_API_KEY" ]; then
            echo "::error::CDS_API_KEY is not set and heat/fetch_lsm.py needs"
            echo "::error::it. Failing rather than producing a payload short"
            echo "::error::of a city, which the gate would then hold on for"
            echo "::error::a reason unrelated to the weather."
            exit 1
          fi
          cat > ~/.cdsapirc <<EOF
          url: https://cds.climate.copernicus.eu/api
          key: $CDS_API_KEY
          EOF
          chmod 600 ~/.cdsapirc

      # THIS STEP USED TO BE `set -e` OVER THE LOOP, AND THAT IS WHY THIS
      # WORKFLOW HAD NEVER SUCCEEDED ONCE, 2026-08-09 to 2026-09-07, six
      # runs six failures, with nothing alerting because a scheduled job
      # that fails looks the same as one nobody watches. Heat found it:
      # fetch_meteofrance.py raised IndexError on a single empty response
      # (fixed their side, 54c14582), it sorts eighth of ten here, and
      # `set -e` meant that one crash also took MeteoSwiss, SMHI and the
      # whole payload rebuild with it, every week.
      #
      # The old comment above this step said FAIL FAST so as not to commit
      # a partial payload. That reasoning is real but it bought the
      # opposite: a step that dies on the first bad service is one bad
      # service away from a TOTAL no-op, which is the state this was in
      # for a month. Nine services fetched and one dead is a better
      # payload than nothing at all, and the refresh gate downstream is
      # what decides whether a changed set may publish. Same isolation
      # ruling as D-289 one level down: a failure gets to cost its own
      # service and nothing else.
      #
      # Each fetcher runs isolated, failures are tallied and named loudly,
      # and the step fails only when EVERY fetcher failed, which means a
      # systemic problem (no network, no keys) rather than one dead
      # service. A partial fetch is reported and allowed through.
      #
      # refresh_sources.py IS NOT OPTIONAL AND WAS NEVER CALLED HERE.
      # Four of the ten fetch_*.py write nothing at all: aemet, geosphere
      # and meteofrance because their fetch() shapes are not what the
      # cache holds (see that file's own docstring, which explains why a
      # main() bolted onto each would emit the wrong shape from the wrong
      # station list AND LOOK LIKE A FIX), and lsm because it is a static
      # land-sea mask that correctly needs no write. So even with the
      # crash above fixed, France, Spain and Vienna, eighteen cities,
      # could never refresh. It runs after the loop because it reads the
      # city list from build_city_series rather than a second copy.
      - name: Fetch
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: |
          failed=""
          total=0
          for f in heat/fetch_*.py; do
            total=$((total + 1))
            echo "--- $f"
            if ! python "$f"; then
              echo "::warning::$f failed; continuing with the rest."
              failed="$failed $f"
            fi
          done
          echo "--- heat/refresh_sources.py"
          if ! python heat/refresh_sources.py; then
            echo "::warning::heat/refresh_sources.py failed; MeteoFrance, AEMET and GeoSphere did not refresh."
            failed="$failed heat/refresh_sources.py"
            total=$((total + 1))
          fi
          n=$(echo $failed | wc -w | tr -d ' ')
          if [ "$n" -gt 0 ]; then
            echo "::warning::$n of $total fetch steps failed:$failed"
          fi
          if [ "$n" -ge "$total" ]; then
            echo "::error::EVERY fetch step failed, so this is systemic (network," \
                 "credentials) rather than one dead service. Not rebuilding a payload" \
                 "from a cache that nothing refreshed."
            exit 1
          fi

      # THE EIGHTEEN ASSEMBLED CITIES, and this step exists because making
      # their outputs tracked (012f60d7) fixed the cold start and quietly
      # created a worse bug in its place. They BUILD in CI because the
      # tracked file is read; they never REFRESHED, because their builders
      # are not fetch_*.py and the loop above never reaches them. So the
      # weekly job would publish London, Belfast, Rome, the seven Argentine
      # cities and the rest at whatever date was last committed BY HAND,
      # indefinitely, with every check green and counted_to simply not
      # moving. Heat caught it live: London, Nottingham and Belfast had sat
      # at 2026-08-21 until they ran the builders by hand, and Nottingham's
      # false record claim would have survived with them, because its
      # season could never complete.
      #
      # No CEDA secret is needed and that is verified, not assumed:
      # build_uk calls _token() only under `if any(_frozen(c) is None)`,
      # and all four MIDAS histories are committed under
      # heat/data/histories/, so the weekly path never reaches it. CEDA is
      # needed only to ADD or repair a city, which is not this job.
      #
      # build_tallinn IS DELIBERATELY ABSENT. It reads the tracked
      # Keskkonnaagentuur workbook and fetches nothing, so running it here
      # would burn a step to rewrite an identical file. Tallinn's
      # 2026-07-31 cut is that source's own extent, not our pipeline
      # failing, and it moves when Keskkonnaagentuur send a new archive.
      # Do not "fix" it by adding it here.
      #
      # Isolated and tallied like the fetch loop, and for the same reason
      # one level down: a builder that fails leaves its tracked file
      # STALE, not missing, so the payload is still complete and the
      # pre-flight in build_city_series has nothing to catch. That makes a
      # silent staleness the failure mode, which is exactly what this step
      # exists to end, so every failure is named loudly here and the run
      # still produces a payload from the rest.
      - name: Refresh the assembled cities
        run: |
          failed=""
          total=0
          for b in build_uk build_london build_bridge build_argentina; do
            total=$((total + 1))
            echo "--- heat/$b.py"
            if ! python "heat/$b.py"; then
              echo "::warning::heat/$b.py failed; its cities keep their last committed date."
              failed="$failed $b"
            fi
          done
          n=$(echo $failed | wc -w | tr -d ' ')
          if [ "$n" -gt 0 ]; then
            echo "::warning::$n of $total assembled-city builders failed:$failed"
          fi
          if [ "$n" -ge "$total" ]; then
            echo "::error::EVERY assembled-city builder failed. Eighteen cities would" \
                 "publish at their last hand-committed date with nothing else flagging it."
            exit 1
          fi

      - name: Rebuild the payload
        run: |
          set -e
          python heat/build_city_series.py
          python heat/emit_city_nights.py

      # Committed BEFORE the gate runs, and regardless of its verdict. The
      # payload is the record of what the sources said this week; a held
      # refresh is still a true observation and losing it because a rank
      # moved would be the wrong trade. The gate governs PUBLISHING, not
      # keeping.
      # SILENCE IS THE SIGNAL. Asks the builders, not the payload, whether
      # every assembled city was accounted for. Two earlier versions of
      # this check asked the DATA whether work had been available and both
      # failed: "is any city short" is permanently true because Aberdeen
      # and Tallinn never resolve, and "did a shortfall grow" is silent
      # out of season because the frontier pins to the season end, which
      # made it silent on Rome, the actual incident, for the whole freeze.
      # The payload does not contain whether there was work to do. Only
      # the builder knows whether it fetched, held, refused, or quietly
      # read a cache and completed.
      #
      # BEFORE the commit, and it must stay there. heat/data/status/ is
      # gitignored and describes THIS run, so the check has to run in the
      # same job that ran the builders; and an earlier version of a check
      # here was first placed after the commit step, where it would have
      # compared the payload against itself and passed forever.
      #
      # Non-blocking is NOT an option here, unlike the frontier advisory:
      # an unaccounted city is not a labelled short city, it is a city
      # nobody can say anything about.
      - name: Every city accounted for
        run: python scripts/check_heat_accounted.py

      - name: Commit the payload
        run: |
          git config user.name  "tls-heat-refresh"
          git config user.email "noreply@thelongswell.com"
          # Pathspec ON THE COMMIT, not only on the add. Harmless here (a
          # fresh runner never has another chat's work staged) but this
          # file is read as an example, and CLAUDE.md's 2026-08-31 entry
          # says exactly this pattern is what swept 69 of another chat's
          # files into an unrelated commit. Heat flagged it reading as an
          # approved instance of the thing we told everyone not to do.
          # heat/data/sources/ is committed alongside the payload, and it
          # has to be: the builders above write the eighteen assembled
          # cities and AEMET into tracked files, so leaving them on the
          # runner would discard the refresh and rebuild the same days
          # from the same stale base next week. Plain JSON (D-294) is what
          # makes these diffs reviewable, which is the whole reason that
          # call went the way it did.
          git add heat/data/city_series.json heat/data/city_nights.json \
                  heat/data/sources
          if git diff --cached --quiet; then
            echo "Payload unchanged this week; nothing to commit."
          else
            git commit heat/data/city_series.json heat/data/city_nights.json \
                       heat/data/sources \
              -m "heat: weekly refresh $(date -u +'%Y-%m-%d')"
            bash scripts/push_retry.sh main
          fi

      # Reports the verdict; never fails the job on a HOLD. A hold is the
      # gate working, not an error, and turning it red would train everyone
      # to ignore a red heat-refresh. Written to the job summary so it is
      # visible without opening logs, because there is no alerting yet.
      - name: Refresh gate
        run: |
          set +e
          out=$(python heat/refresh_gate.py 2>&1); code=$?
          echo "$out"
          {
            echo "## Heat refresh gate"
            echo ""
            if [ $code -eq 0 ]; then
              echo "**PUBLISH.** No rank, band, count or claim moved."
              echo "The next publish_all run will render this payload."
            else
              echo "**HOLD.** Product decides before this ships."
              echo "The last approved heat pages stay live; publish_all"
              echo "skips the heat steps while this holds."
            fi
            echo ""
            echo '```'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
