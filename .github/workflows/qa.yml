name: qa

on:
  # SCHEDULED as well as on push. QA's escalation map, 2026-08-04: this
  # workflow had no schedule at all, so freshness was only checked when
  # somebody pushed, while staleness is a function of TIME. On a quiet
  # weekend the check simply did not run. An event-triggered check on a
  # time-driven property is the same defect family we found four times
  # this week, one level up: nothing wrong with the check, wrong kind of
  # trigger for what it measures.
  #
  # 06:30 UTC, after the fires job (03:10, 05:30 backstop) has landed the
  # day's data, so a freshness failure means the data really is stale
  # rather than that we looked too early.
  schedule:
    - cron: "30 6 * * *"
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    # Every job gets one. The Floods chat lost 2h20m to an HDF5 deadlock
    # that never crashed: process alive, state sleeping, 11 seconds of
    # CPU consumed. A hang is not a failure until something calls it one,
    # so an untimed job sits until the runner limit.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run QA gate
        run: |
          BASE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          fi
          if [ -n "$BASE" ] && git cat-file -e "$BASE" 2>/dev/null; then
            python3 scripts/qa_check.py --base "$BASE"
          else
            python3 scripts/qa_check.py --no-frozen-check
          fi

  # Separate job on purpose: the gate above is stdlib-only and fast, and
  # should not wait on a dependency install. This one proves a different
  # thing, that docs/ still matches the generator that claims to produce
  # it. A page can pass every structural check while having been built
  # from a tree that no longer exists, which happened on 2026-07-28 when
  # a publish ran either side of a merge and the committed front page
  # silently lost CSS the source still emitted. Design chat's idea.
  docs-match-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Assert docs/ is not stale relative to its generator
        run: python scripts/publish_all.py --check --assert-clean

      # Different question from the one above, and the one nothing asked
      # until a layer froze for two days behind a well-formed page.
      # "Does docs match its generator" was TRUE the whole time that page
      # was stale, because the generator was faithfully rendering old
      # data. This asks whether the data itself is still moving.
      - name: Assert every published data layer is fresh
        run: python scripts/check_freshness.py
