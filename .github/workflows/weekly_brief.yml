name: Weekly El Nino brief

on:
  schedule:
    # Mondays at 13:00 UTC = ~16:00 EET (Tallinn). NOAA wksst9120 typically
    # updates by 12:00 UTC Mondays; this gives it a buffer.
    - cron: "0 13 * * 1"
  workflow_dispatch:        # allow manual runs from the Actions tab

permissions:
  contents: write           # to commit snapshot + brief back to the repo

# Serialise every workflow that publishes. With per-channel schedules
# two of these will eventually run at once, and a race between two
# publishes is a corrupted commit rather than a slow build. One shared
# group name across all publishing workflows is the point. D-027.
# cancel-in-progress is false on purpose: the Monday brief must never be
# cancelled by a fires run starting behind it (invariant 1).
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    # CDS queue waits can run 20-60 min during busy periods. 90 covers most
    # of the distribution; if a run still times out, the previous good chart
    # stays live (Pages keeps the last successful build).
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history, so snapshots/ comparisons work

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure CDS API key
        env:
          CDS_API_KEY: ${{ secrets.CDS_API_KEY }}
        run: |
          # cdsapi reads ~/.cdsapirc; format is two lines:
          #   url: https://cds.climate.copernicus.eu/api
          #   key: <UID>:<API key>
          if [ -n "$CDS_API_KEY" ]; then
            cat > ~/.cdsapirc <<EOF
          url: https://cds.climate.copernicus.eu/api
          key: $CDS_API_KEY
          EOF
            chmod 600 ~/.cdsapirc
          else
            echo "CDS_API_KEY not set; ECMWF and ERA5 fetchers will fall back."
          fi

      # IMMEDIATELY BEFORE THE RENDER, because the caption and the image
      # are coupled and only look independent. build_public_html reads
      # docs/pacific-sst.json at RENDER time and bakes its figures into
      # the caption, while the PNG is a separate file the page merely
      # points at. So refreshing the pair by hand between runs leaves a
      # fresh image under a caption stating the old numbers, and design
      # measured how far apart they had drifted: 5.2% of cells beyond
      # scale becoming 8.7%, the week's highest +5.71 C becoming +6.18 C.
      #
      # That is the qualifier separated from its figure, which is the
      # defect this house has spent the week removing from payloads.
      # Running the generator here makes image and caption land together
      # by construction rather than by anyone remembering.
      #
      # NOT in publish_all, and this is the reason the hand path existed
      # at all: this FETCHES, from NOAA PSL OPeNDAP, and publish_all runs
      # renderers only. The weekly job is where fetching belongs.
      #
      # continue-on-error because invariant 1 outranks a fresh picture: if
      # NOAA is unreachable the brief still ships with last week's field,
      # and check_freshness reports the age. A stale image is a worse page;
      # no brief is a worse week.
      # SKIPPED WHEN THIS WEEK'S ARCHIVE ALREADY EXISTS, because then
      # run_brief exits at the freeze guard without rendering, and
      # refreshing the asset would advance the IMAGE while its CAPTION
      # stayed on last week's numbers. build_public_html reads
      # docs/pacific-sst.json at render time and bakes the figures in; the
      # PNG is a separate file the page only points at. That is the exact
      # qualifier-separated-from-its-figure defect design caught last
      # week, arriving by a different route.
      #
      # It only bites when a manual publish beats the cron, which is what
      # happened on 2026-08-17: the issue went live at 08:52 and the cron
      # fires at 13:00 into a frozen archive. Guarded rather than left to
      # whoever notices, and guarded HERE rather than by disabling the
      # schedule, because a disabled cron has to be remembered back on and
      # that is the failure this project keeps finding.
      #
      # SCIENCE'S FINDING, 2026-08-27: the guard is correct and still has
      # an undeclared cost, because "manual publish beats the cron" has
      # been the norm for two weeks rather than the rare exception this
      # comment assumes. Hand-publishes on 08-17 and 08-24 both fired this
      # skip, so the asset only stayed fresh because someone ran it by
      # hand afterward, on top of publishing by hand. If hand-publishing
      # stays routine, this step is routinely a no-op and the freshness
      # budget is quietly riding on that manual follow-through rather than
      # on this guard's own logic. Worth checking whether the SST refresh
      # actually happened whenever a Monday is published early, not
      # assuming this step covered it.
      - name: Refresh the Pacific SST field
        continue-on-error: true
        run: |
          d=$(date -u +'%Y-%m-%d')
          # The issue date is the most recent Monday, which is today when
          # this runs on its own cron.
          if [ -d "docs/briefs/$d" ]; then
            echo "docs/briefs/$d is already published, so run_brief will"
            echo "exit at the freeze guard and render nothing. Skipping the"
            echo "SST refresh: advancing the image without its caption is"
            echo "worse than leaving both on last week."
            exit 0
          fi
          python design/make_pacific_sst.py

      - name: Run brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python run_brief.py

      - name: Commit snapshot and brief
        run: |
          git config user.name "el-nino-tracker-bot"
          git config user.email "actions@github.com"
          git add snapshots/ briefs/ docs/
          # Only commit if something changed
          if ! git diff --cached --quiet; then
            git commit -m "Weekly brief: $(date -u +'%Y-%m-%d')"
            bash scripts/push_retry.sh main
          else
            echo "No changes to commit."
          fi

      - name: Email the brief
        if: ${{ env.SMTP_HOST != '' }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          BRIEF_RECIPIENT: ${{ secrets.BRIEF_RECIPIENT }}
        run: |
          python scripts/send_email.py
