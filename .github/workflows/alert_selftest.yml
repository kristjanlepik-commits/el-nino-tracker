name: Alert self-test

# Manual only. Proves the alert path end to end as github-actions[bot]:
# token scope, issue creation, assignment. A test run locally would
# create the issue as Kristjan, and GitHub does not email you about your
# own activity, so only this path tests what actually reaches him.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/open_alert_issue.sh \
            "Alert self-test (safe to close)" \
            "If this reached your inbox, failure alerts work. Nothing is broken. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
